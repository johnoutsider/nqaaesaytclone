server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html keshlanmaydi — har yangilanishdan keyin brauzer darhol yangi versiyani oladi
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Vite yig'gan fayllar nomida xesh bor (index-XXXX.js) — uzoq keshlash xavfsiz
    location ~* ^/assets/index-.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
